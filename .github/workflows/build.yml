name: Windows-EXE bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Versionsnummer setzen
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION).${{ github.run_number }}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          sed -i "s/const APP_VERSION='[^']*'/const APP_VERSION='$VER'/" app/index.html
          grep -o "APP_VERSION='[^']*'" app/index.html

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Makroschliff
          --icon assets/icon.ico
          --add-data "app;app"
          makroschliff.py

      - name: EXE als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Makroschliff-exe
          path: dist/Makroschliff.exe

      - name: Release veröffentlichen (jeder Push auf main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: MakroMaster v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          generate_release_notes: true
          files: dist/Makroschliff.exe
