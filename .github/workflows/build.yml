name: Windows-EXE bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Makroschliff
          --icon assets/icon.ico
          --add-data "app;app"
          makroschliff.py

      - name: EXE als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Makroschliff-exe
          path: dist/Makroschliff.exe

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Makroschliff.exe
          generate_release_notes: true
